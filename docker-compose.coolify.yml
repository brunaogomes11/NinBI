name: ninbi

services:
  app:
    image: ${NINBI_IMAGE:?Defina NINBI_IMAGE com a imagem publicada pelo GitHub Actions}
    pull_policy: ${NINBI_PULL_POLICY:-always}
    expose:
      - "8080"
    environment:
      DATABASE_URL: postgres://ninbi:${NINBI_POSTGRES_PASSWORD:?Defina NINBI_POSTGRES_PASSWORD}@postgres:5432/ninbi
      NINBI_ENCRYPTION_KEY: ${NINBI_ENCRYPTION_KEY:?Defina NINBI_ENCRYPTION_KEY}
      NINBI_COOKIE_SECURE: "true"
      NINBI_MAP_TILE_URL: ${NINBI_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      NINBI_MAP_ATTRIBUTION: ${NINBI_MAP_ATTRIBUTION:-© OpenStreetMap}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health', { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ninbi
      POSTGRES_PASSWORD: ${NINBI_POSTGRES_PASSWORD:?Defina NINBI_POSTGRES_PASSWORD}
      POSTGRES_DB: ninbi
    volumes:
      - ninbi-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ninbi -d ninbi"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped

volumes:
  ninbi-pg:
