name: Publicar imagem NinBI

on:
  push:
    branches: [main, codex/coolify-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Definir a tag da imagem
        id: image
        shell: bash
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Construir a imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.ref }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Verificar a imagem com PostgreSQL
        env:
          NINBI_IMAGE: ${{ steps.image.outputs.ref }}
          NINBI_PULL_POLICY: never
        shell: bash
        run: |
          export NINBI_POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          export NINBI_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          compose=(docker compose -f docker-compose.coolify.yml)
          trap '"${compose[@]}" down -v' EXIT
          if ! "${compose[@]}" up --wait --wait-timeout 120 --no-build; then
            "${compose[@]}" logs --no-color
            exit 1
          fi
          "${compose[@]}" exec -T app node -e "fetch('http://127.0.0.1:8080/').then(async r => { if (!r.ok || !(await r.text()).includes('<title>NinBI</title>')) process.exit(1) })"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar no GHCR
        env:
          NINBI_IMAGE: ${{ steps.image.outputs.ref }}
        shell: bash
        run: |
          docker push "$NINBI_IMAGE"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            moving="${NINBI_IMAGE%%:*}:main"
            docker tag "$NINBI_IMAGE" "$moving"
            docker push "$moving"
            echo "NINBI_IMAGE=$moving (tag móvel)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "\`NINBI_IMAGE=$NINBI_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
